[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "image-denoising-claim-audit"
version = "0.1.0"
description = "Offline deterministic documentation claim auditor"
readme = "README.md"
requires-python = ">=3.9"
license = "MIT"
license-files = ["LICENSE"]
dependencies = []

[project.scripts]
image-denoising-claim-audit = "image_denoising_claim_audit.audit:main"

[tool.setuptools.packages.find]
include = ["image_denoising_claim_audit*"]
